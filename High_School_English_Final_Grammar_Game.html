<style>

const state={filtered:[],index:0,answers:{},order:QUESTIONS.map(q=>q.id)};
const byId=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const $=id=>document.getElementById(id);

function shuffle(array){const a=array.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cleanText(value){return value.toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9']/g,' ').replace(/\s+/g,' ').trim()}
function escapeHTML(value){return String(value).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function getRecord(id){if(!state.answers[id])state.answers[id]={selected:null,chosen:[],checked:false,correct:false,attempts:0,bank:null,input:""};return state.answers[id]}
function questionList(){const chapter=$('chapterFilter').value,section=$('sectionFilter').value;return state.order.map(id=>byId[id]).filter(q=>{const chapterOK=chapter==='all'||String(q.chapter)===chapter||(chapter==='wrong'&&state.answers[q.id]&&state.answers[q.id].checked&&!state.answers[q.id].correct);const sectionOK=section==='all'||q.sectionCode===section;return chapterOK&&sectionOK})}
function applyFilters(keepId){const oldId=keepId||(state.filtered[state.index]&&state.filtered[state.index].id);state.filtered=questionList();const found=state.filtered.findIndex(q=>q.id===oldId);state.index=found>=0?found:0;render()}
function optionLabel(i){return ['①','②','③','④'][i]||String(i+1)}
function displayPrompt(q){return q.promptHtml||escapeHTML(q.prompt)}
function candidateFor(q,r){if(q.type==='order'){const middle=r.chosen.map(c=>c.text).join(' ');return [q.prefix,middle,q.suffix].filter(Boolean).join(' ').replace(/\s+([.,?!])/g,'$1').replace(/\s+/g,' ').trim()}return r.input.trim()}

function restoreViewport(x,y){window.scrollTo(x,y);requestAnimationFrame(()=>window.scrollTo(x,y))}
function render(){const scrollX=window.scrollX,scrollY=window.scrollY;updateStatus();const host=$('game');if(!state.filtered.length){host.innerHTML='<div class="empty"><h2>表示できる問題がありません</h2><p>「間違えた問題だけ」を選んだ場合は、先に問題を解いてください。</p></div>';restoreViewport(scrollX,scrollY);return}
 const q=state.filtered[state.index],r=getRecord(q.id);let body='';
 if(q.type==='mc'){body='<div class="options" role="radiogroup" aria-label="選択肢">'+q.options.map((o,i)=>{let cls='option'+(r.selected===i?' selected':'');if(r.checked&&i===q.answerIndex)cls+=' correctPick';if(r.checked&&r.selected===i&&i!==q.answerIndex)cls+=' wrongPick';return `<button type="button" class="${cls}" data-option="${i}" role="radio" aria-checked="${r.selected===i}" ${r.checked?'disabled':''}>${optionLabel(i)} ${escapeHTML(o)}</button>`}).join('')+'</div>';
 }else if(q.type==='order'){if(!r.bank)r.bank=shuffle(q.chunks.map((text,i)=>({text,key:i})));const chosenSet=new Set(r.chosen.map(x=>x.key));body='<div class="instruction">単語カードを正しい順にクリックしてください。並べたカードを押すと元に戻せます。</div><div class="build" aria-label="解答欄">'+(q.prefix?`<span class="fixed">${escapeHTML(q.prefix)}</span>`:'')+r.chosen.map((c,i)=>`<button type="button" class="chip answerChip" data-chosen="${i}" ${r.checked?'disabled':''}>${escapeHTML(c.text)}</button>`).join('')+(q.suffix?`<span class="fixed">${escapeHTML(q.suffix)}</span>`:'')+'</div><div class="bank" aria-label="単語カード">'+r.bank.map(c=>`<button type="button" class="chip ${chosenSet.has(c.key)?'used':''}" data-bank="${c.key}" ${chosenSet.has(c.key)||r.checked?'disabled':''}>${escapeHTML(c.text)}</button>`).join('')+'</div>';
 }else{body='<div class="instruction">英文全体を入力してください（大文字・小文字や句読点の違いは採点に影響しません）。</div><input class="textAnswer" id="textAnswer" type="text" autocomplete="off" value="'+escapeHTML(r.input)+'" '+(r.checked?'disabled':'')+' aria-label="英文の解答">'}
 const typeName=q.type==='mc'?'選択問題':q.type==='order'?'語順整序':'英文入力';
 const orderTranslation=q.type==='order'?`<div class="orderTranslation"><span>日本語</span>${escapeHTML(q.translation)}</div>`:'';
 const feedback=r.checked?`<div class="feedback show ${r.correct?'good':'bad'}" id="feedback" tabindex="-1"><div class="resultTitle">${r.correct?'✓ 正解！':'△ もう一度確認しよう'}</div><div>正解</div><div class="answerLine">${escapeHTML(q.answer)}</div><div class="translation"><strong>和訳</strong><br>${escapeHTML(q.translation)}</div>${q.point?`<div class="point">ポイント：${escapeHTML(q.point)}</div>`:''}<button class="speak" id="speakBtn" type="button">🔊 正解文を読む</button></div>`:'';
 host.innerHTML=`<article class="card"><div class="meta"><span class="tag">${escapeHTML(q.id)}</span><span class="type">${escapeHTML(q.chapterTitle)}｜${escapeHTML(q.section)}｜${typeName}</span></div>${orderTranslation}<div class="prompt">${displayPrompt(q)}</div>${body}<div class="actions"><button class="primary" id="checkBtn" type="button" ${r.checked?'disabled':''}>チェック</button>${r.checked?'<button class="secondary" id="retryBtn" type="button">もう一度解く</button>':''}<span class="checkMessage" id="checkMessage" role="status"></span></div>${feedback}</article><nav class="nav" aria-label="問題移動"><button class="secondary" id="prevBtn" type="button" ${state.index===0?'disabled':''}>← 前の問題</button><button class="secondary" id="nextBtn" type="button" ${state.index===state.filtered.length-1?'disabled':''}>次の問題 →</button></nav>`;
 bindQuestionEvents(q,r);restoreViewport(scrollX,scrollY);
}

function bindQuestionEvents(q,r){document.querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>{r.selected=Number(btn.dataset.option);render()}));document.querySelectorAll('[data-bank]').forEach(btn=>btn.addEventListener('click',()=>{const key=Number(btn.dataset.bank),chip=r.bank.find(c=>c.key===key);if(chip)r.chosen.push(chip);render()}));document.querySelectorAll('[data-chosen]').forEach(btn=>btn.addEventListener('click',()=>{r.chosen.splice(Number(btn.dataset.chosen),1);render()}));
 const input=$('textAnswer');if(input)input.addEventListener('input',e=>r.input=e.target.value);$('checkBtn').addEventListener('click',()=>checkAnswer(q,r));const retry=$('retryBtn');if(retry)retry.addEventListener('click',()=>{r.selected=null;r.chosen=[];r.input='';r.checked=false;r.correct=false;r.bank=q.chunks?shuffle(q.chunks.map((text,i)=>({text,key:i}))):null;render()});const speak=$('speakBtn');if(speak)speak.addEventListener('click',()=>speakAnswer(q.answer));$('prevBtn').addEventListener('click',()=>{if(state.index>0){state.index--;render()}});$('nextBtn').addEventListener('click',()=>{if(state.index<state.filtered.length-1){state.index++;render()}})}

function checkAnswer(q,r){const msg=$('checkMessage');if(q.type==='mc'&&r.selected===null){msg.textContent='選択肢を1つ選んでください。';return}if(q.type==='order'&&r.chosen.length!==q.chunks.length){msg.textContent='すべてのカードを並べてください。';return}if(q.type==='input'&&!r.input.trim()){msg.textContent='英文を入力してください。';return}
 let ok=false;if(q.type==='mc')ok=r.selected===q.answerIndex;else ok=cleanText(candidateFor(q,r))===cleanText(q.answer);r.checked=true;r.correct=ok;r.attempts++;render();setTimeout(()=>{const f=$('feedback');if(f)f.focus({preventScroll:true})},0)}
function speakAnswer(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;window.speechSynthesis.speak(u)}
function updateStatus(){const total=state.filtered.length||0,checked=Object.values(state.answers).filter(r=>r.checked).length,correct=Object.values(state.answers).filter(r=>r.checked&&r.correct).length,wrong=Object.values(state.answers).filter(r=>r.checked&&!r.correct).length;$('counter').textContent=total?`${state.index+1} / ${total}`:`0 / 0`;$('checkedCount').textContent=checked;$('correctCount').textContent=correct;$('wrongCount').textContent=wrong;$('progressBar').style.width=total?`${((state.index+1)/total)*100}%`:'0%'}

$('chapterFilter').addEventListener('change',()=>applyFilters());$('sectionFilter').addEventListener('change',()=>applyFilters());$('shuffleBtn').addEventListener('click',()=>{state.order=shuffle(state.order);applyFilters()});$('resetAllBtn').addEventListener('click',()=>{if(confirm('すべての回答記録をリセットしますか？')){state.answers={};state.order=QUESTIONS.map(q=>q.id);$('chapterFilter').value='all';$('sectionFilter').value='all';applyFilters()}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'&&state.index<state.filtered.length-1){state.index++;render()}if(e.key==='ArrowLeft'&&state.index>0){state.index--;render()}});
applyFilters();
</script>
</body>
</html>
